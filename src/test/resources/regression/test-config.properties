# SQL Parsing Regression Test Configuration

# Directories to exclude from regression testing
# Comma-separated list of directory paths (relative to tests/regress/sql)
# Example: exclude.wastebin,exclude.temp

exclude.directories=

# File patterns to exclude from testing
# Comma-separated list of file name patterns (supports * wildcard)
# Example: exclude.files=test_*,*_backup.sql

exclude.files=

# Large file threshold in bytes (default: 10240 = 10KB)
# Files larger than this threshold will be tagged with @Tag("slow")
large.file.threshold=10240
